# Configuration for GJR GARCH model with 5% noise
# Larger dataset for neural network training

[model]
type = "GJR"

[scaling]
contracts_per_day = 60
num_days = 25
batch_size = 150
num_param_sets = 8

[market]
N = 1260
r = 0.0001984
S0 = 100.0
moneyness_range = [0.7, 1.3]
maturity_days = [30, 60, 90, 180, 360]

[willow_tree]
m_h = 6
gamma_h = 0.6
m_x = 30
gamma_x = 0.8

[performance]
use_gpu = false
num_workers = 0
optimize_memory = false

[noise]
# 5% noise level - simulates market frictions
level = 0.05
seed = 999

[output]
folder = ""
filename = ""
save_asset_prices = true
save_logs = true
